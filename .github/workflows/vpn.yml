          package app.slienky.vpn

          import android.app.Application
          import android.content.Context
          import androidx.work.*
          import java.util.concurrent.TimeUnit

          class SlienkyApp : Application() {
              override fun onCreate() {
                  super.onCreate()
                  val req = PeriodicWorkRequestBuilder<ListWorker>(1, TimeUnit.HOURS)
                      .setConstraints(Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build())
                      .build()
                  WorkManager.getInstance(this)
                      .enqueueUniquePeriodicWork("slienky-lists", ExistingPeriodicWorkPolicy.KEEP, req)
              }
          }

          class ListWorker(ctx: Context, p: WorkerParameters) : CoroutineWorker(ctx, p) {
              override suspend fun doWork(): Result {
                  ServerRepo.refresh(applicationContext)
                  return Result.success()
              }
          }
