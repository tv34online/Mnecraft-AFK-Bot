          @Composable
          fun SlideButton(label: String, active: Boolean, modifier: Modifier, onComplete: () -> Unit) {
              val density = LocalDensity.current
              BoxWithConstraints(
                  modifier.height(64.dp).clip(RoundedCornerShape(32.dp)).background(Color(0xFF1E1E1E))
              ) {
                  val knob = 56.dp
                  val maxPx = with(density) { (maxWidth - knob - 8.dp).toPx() }
                  var drag by remember { mutableFloatStateOf(0f) }
                  var dragging by remember { mutableStateOf(false) }
                  val shown by animateFloatAsState(
                      targetValue = if (dragging) drag else 0f,
                      animationSpec = if (dragging) snap() else spring(),
                      label = "knob"
                  )
                  val progress = if (maxPx > 0f) (shown / maxPx).coerceIn(0f, 1f) else 0f

                  Text(
                      label, color = Color.White, fontSize = 17.sp, fontWeight = FontWeight.Medium,
                      modifier = Modifier.align(Alignment.Center).padding(start = 40.dp).alpha(1f - progress)
                  )
                  Box(
                      Modifier.align(Alignment.CenterStart)
                          .padding(4.dp)
                          .offset { IntOffset(shown.roundToInt(), 0) }
                          .size(knob).clip(CircleShape).background(Color(0xFFE6E6E6))
                          .draggable(
                              orientation = Orientation.Horizontal,
                              state = rememberDraggableState { d -> drag = (drag + d).coerceIn(0f, maxPx) },
                              onDragStarted = { dragging = true },
                              onDragStopped = {
                                  dragging = false
                                  if (drag > maxPx * 0.8f) onComplete()
                                  drag = 0f
                              }
                          ),
                      contentAlignment = Alignment.Center
                  ) { Text(if (active) "✕" else "→", color = Color.Black, fontSize = 24.sp) }
              }
          }

          @Composable
