          package app.slienky.vpn

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          object ServerRepo {
              private const val BASE = "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-"
              val URLS = (1..10).map { "$BASE$it.txt" }
              private const val MAX_AGE = 60 * 60 * 1000L
              private val PREFIXES = listOf("vless://", "vmess://", "trojan://", "ss://")

              private fun file(c: Context) = File(c.filesDir, "servers.txt")
              private fun prefs(c: Context) = c.getSharedPreferences("slienky", Context.MODE_PRIVATE)

              fun lastUpdate(c: Context): Long = prefs(c).getLong("updated", 0L)
              fun count(c: Context): Int = prefs(c).getInt("count", 0)

              private fun download(url: String): String? = try {
                  val con = URL(url).openConnection() as HttpURLConnection
                  con.connectTimeout = 15000
                  con.readTimeout = 20000
                  try {
                      if (con.responseCode == 200) con.inputStream.bufferedReader().readText() else null
                  } finally {
                      con.disconnect()
                  }
              } catch (e: Exception) {
                  null
              }

              private fun expand(text: String): List<String> {
                  val t = if (text.contains("://")) text else try { LinkParser.b64(text) } catch (e: Exception) { "" }
                  return t.lineSequence().map { it.trim() }.filter { l -> PREFIXES.any { l.startsWith(it) } }.toList()
              }

              /** Скачивает все 10 списков. Если ничего не скачалось — старый кэш остаётся. */
              suspend fun refresh(c: Context): Int = withContext(Dispatchers.IO) {
                  val texts = coroutineScope { URLS.map { u -> async { download(u) } }.awaitAll() }
                  val links = LinkedHashSet<String>()
                  for (t in texts) if (t != null) links.addAll(expand(t))
                  if (links.isEmpty()) return@withContext 0
                  file(c).writeText(links.joinToString("\n"))
                  prefs(c).edit().putLong("updated", System.currentTimeMillis()).putInt("count", links.size).apply()
                  links.size
              }

              suspend fun load(c: Context): List<Server> = withContext(Dispatchers.IO) {
                  val f = file(c)
                  if (!f.exists() || System.currentTimeMillis() - lastUpdate(c) > MAX_AGE) refresh(c)
                  if (!f.exists()) return@withContext emptyList()
                  f.readLines().mapNotNull { LinkParser.parse(it) }
              }
          }
