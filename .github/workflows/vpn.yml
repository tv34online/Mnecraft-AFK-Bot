          package app.slienky.vpn

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit
          import kotlinx.coroutines.withContext
          import java.net.InetSocketAddress
          import java.net.Socket

          object Pinger {
              private fun tcp(host: String, port: Int): Int? = try {
                  val t = System.nanoTime()
                  Socket().use { it.connect(InetSocketAddress(host, port), 2500) }
                  ((System.nanoTime() - t) / 1_000_000).toInt()
              } catch (e: Exception) {
                  null
              }

              /** Быстрый TCP-пинг случайной выборки серверов. Возвращает живые, от быстрого к медленному. */
              suspend fun tcpScan(servers: List<Server>, limit: Int = 500): List<Pair<Server, Int>> = coroutineScope {
                  val sem = Semaphore(80)
                  servers.distinctBy { it.key }.shuffled().take(limit).map { s ->
                      async(Dispatchers.IO) { sem.withPermit { tcp(s.host, s.port)?.let { s to it } } }
                  }.awaitAll().filterNotNull().sortedBy { it.second }
              }
          }
