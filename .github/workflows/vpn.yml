          package app.slienky.vpn

          import kotlinx.coroutines.flow.MutableStateFlow

          sealed interface VpnStatus {
              data object Idle : VpnStatus
              data class Working(val text: String) : VpnStatus
              data class Connected(val name: String, val ping: Int) : VpnStatus
              data class Failed(val text: String) : VpnStatus
          }

          object VpnState {
              val status = MutableStateFlow<VpnStatus>(VpnStatus.Idle)
          }
