      - name: Signing key (cached, so updates install over old versions)
        uses: actions/cache@v4
        with:
          path: slienky.jks
          key: slienky-keystore-v1

      - name: Create keystore if missing
        run: |
          if [ ! -f slienky.jks ]; then
            keytool -genkeypair -keystore slienky.jks -alias slienky -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass slienky123 -keypass slienky123 -dname "CN=Slienky VPN"
          fi
          cp slienky.jks app/slienky.jks

      - name: Download Xray core (libv2ray.aar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download --repo 2dust/AndroidLibXrayLite --pattern "*.aar" --dir app/libs --clobber
          mv app/libs/*.aar app/libs/libv2ray.aar
          ls -lh app/libs

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Slienky-VPN
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Slienky-VPN.apk
          gh release create "build-${{ github.run_number }}" Slienky-VPN.apk \
            --title "Slienky VPN build ${{ github.run_number }}" \
            --notes "Автоматическая сборка" --latest
