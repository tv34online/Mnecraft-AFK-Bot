          package app.slienky.vpn

          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URLDecoder

          data class Server(val name: String, val host: String, val port: Int, val outbound: String) {
              val key: String get() = "$host:$port"
          }

          object LinkParser {

              fun parse(raw: String): Server? = try {
                  val line = raw.trim()
                  when {
                      line.startsWith("vless://") -> vless(line)
                      line.startsWith("vmess://") -> vmess(line)
                      line.startsWith("trojan://") -> trojan(line)
                      line.startsWith("ss://") -> ss(line)
                      else -> null
                  }
              } catch (e: Exception) {
                  null
              }

              fun b64(s: String): String {
                  var t = s.trim().replace('-', '+').replace('_', '/')
                  while (t.length % 4 != 0) t += "="
                  return String(Base64.decode(t, Base64.DEFAULT), Charsets.UTF_8)
              }

              private fun dec(s: String) = try { URLDecoder.decode(s, "UTF-8") } catch (e: Exception) { s }

              private class Url(val user: String, val host: String, val port: Int, val q: Map<String, String>, val name: String)

              private fun splitUrl(link: String): Url {
                  val rest = link.substringAfter("://")
                  val name = dec(rest.substringAfter('#', ""))
                  val main = rest.substringBefore('#')
                  val query = main.substringAfter('?', "")
                  val auth = main.substringBefore('?').trimEnd('/')
                  val user = dec(auth.substringBeforeLast('@'))
                  val hp = auth.substringAfterLast('@')
                  val host: String
                  val port: Int
                  if (hp.startsWith("[")) {
                      host = hp.substringAfter('[').substringBefore(']')
                      port = hp.substringAfter("]:").toInt()
                  } else {
                      host = hp.substringBeforeLast(':')
                      port = hp.substringAfterLast(':').toInt()
                  }
                  val q = HashMap<String, String>()
                  if (query.isNotEmpty()) {
                      for (p in query.split('&')) {
                          val k = p.substringBefore('=')
                          val v = dec(p.substringAfter('=', ""))
                          if (k.isNotEmpty() && v.isNotEmpty()) q[k] = v
                      }
                  }
                  return Url(user, host, port, q, name)
              }

              private fun stream(q: Map<String, String>, securityDefault: String = "none"): JSONObject {
                  var net = q["type"] ?: "tcp"
                  if (net == "splithttp") net = "xhttp"
                  if (net == "raw") net = "tcp"
                  val sec = q["security"] ?: securityDefault
                  val s = JSONObject().put("network", net)

                  when (net) {
                      "ws" -> {
                          val o = JSONObject().put("path", q["path"] ?: "/")
                          q["host"]?.let { o.put("headers", JSONObject().put("Host", it)) }
                          s.put("wsSettings", o)
                      }
                      "grpc" -> s.put(
                          "grpcSettings",
                          JSONObject()
                              .put("serviceName", q["serviceName"] ?: q["path"] ?: "")
                              .put("multiMode", q["mode"] == "multi")
                      )
                      "httpupgrade" -> {
                          val o = JSONObject().put("path", q["path"] ?: "/")
                          q["host"]?.let { o.put("host", it) }
                          s.put("httpupgradeSettings", o)
                      }
                      "xhttp" -> {
                          val o = JSONObject().put("path", q["path"] ?: "/")
                          q["host"]?.let { o.put("host", it) }
                          q["mode"]?.let { o.put("mode", it) }
                          q["extra"]?.let { try { o.put("extra", JSONObject(it)) } catch (_: Exception) {} }
                          s.put("xhttpSettings", o)
                      }
                      "kcp" -> {
                          val o = JSONObject().put("header", JSONObject().put("type", q["headerType"] ?: "none"))
                          q["seed"]?.let { o.put("seed", it) }
                          s.put("kcpSettings", o)
                      }
                      "http", "h2" -> {
                          val o = JSONObject().put("path", q["path"] ?: "/")
                          q["host"]?.let { o.put("host", JSONArray(it.split(","))) }
                          s.put("httpSettings", o)
                      }
                      "tcp" -> if (q["headerType"] == "http") {
                          val req = JSONObject()
                              .put("path", JSONArray((q["path"] ?: "/").split(",")))
                              .put("headers", JSONObject().put("Host", JSONArray((q["host"] ?: "").split(","))))
                          s.put("tcpSettings", JSONObject().put("header", JSONObject().put("type", "http").put("request", req)))
                      }
                  }

                  when (sec) {
                      "tls" -> {
                          s.put("security", "tls")
                          val t = JSONObject()
                          (q["sni"] ?: q["host"])?.let { t.put("serverName", it) }
                          q["fp"]?.let { t.put("fingerprint", it) }
                          q["alpn"]?.let { t.put("alpn", JSONArray(it.split(","))) }
                          s.put("tlsSettings", t)
                      }
                      "reality" -> {
                          s.put("security", "reality")
                          s.put(
                              "realitySettings",
                              JSONObject()
                                  .put("serverName", q["sni"] ?: "")
                                  .put("fingerprint", q["fp"] ?: "chrome")
                                  .put("publicKey", q["pbk"] ?: "")
                                  .put("shortId", q["sid"] ?: "")
                                  .put("spiderX", q["spx"] ?: "")
                          )
                      }
                  }
                  return s
              }

              private fun vless(link: String): Server {
                  val u = splitUrl(link)
                  val user = JSONObject().put("id", u.user).put("encryption", u.q["encryption"] ?: "none")
                  u.q["flow"]?.let { user.put("flow", it) }
                  val ob = JSONObject()
                      .put("tag", "proxy")
                      .put("protocol", "vless")
                      .put(
                          "settings",
                          JSONObject().put(
                              "vnext",
                              JSONArray().put(
                                  JSONObject().put("address", u.host).put("port", u.port).put("users", JSONArray().put(user))
                              )
                          )
                      )
                      .put("streamSettings", stream(u.q))
                  return Server(u.name.ifEmpty { u.host }, u.host, u.port, ob.toString())
              }

              private fun vmess(link: String): Server {
                  val j = JSONObject(b64(link.removePrefix("vmess://")))
                  val host = j.getString("add")
                  val port = j.get("port").toString().toInt()
                  val q = HashMap<String, String>()
                  fun put(k: String, v: String?) { if (!v.isNullOrEmpty()) q[k] = v }
                  put("type", j.optString("net", "tcp"))
                  put("security", if (j.optString("tls") == "tls") "tls" else "none")
                  put("sni", j.optString("sni"))
                  put("host", j.optString("host"))
                  put("path", j.optString("path"))
                  put("serviceName", j.optString("path"))
                  put("alpn", j.optString("alpn"))
                  put("fp", j.optString("fp"))
                  put("headerType", j.optString("type"))
                  val user = JSONObject()
                      .put("id", j.getString("id"))
                      .put("alterId", j.optString("aid", "0").toIntOrNull() ?: 0)
                      .put("security", j.optString("scy").ifEmpty { "auto" })
                  val ob = JSONObject()
                      .put("tag", "proxy")
                      .put("protocol", "vmess")
                      .put(
                          "settings",
                          JSONObject().put(
                              "vnext",
                              JSONArray().put(
                                  JSONObject().put("address", host).put("port", port).put("users", JSONArray().put(user))
                              )
                          )
                      )
                      .put("streamSettings", stream(q))
                  return Server(j.optString("ps").ifEmpty { host }, host, port, ob.toString())
              }

              private fun trojan(link: String): Server {
                  val u = splitUrl(link)
                  val ob = JSONObject()
                      .put("tag", "proxy")
                      .put("protocol", "trojan")
                      .put(
                          "settings",
                          JSONObject().put(
                              "servers",
                              JSONArray().put(JSONObject().put("address", u.host).put("port", u.port).put("password", u.user))
                          )
                      )
                      .put("streamSettings", stream(u.q, securityDefault = "tls"))
                  return Server(u.name.ifEmpty { u.host }, u.host, u.port, ob.toString())
              }

              private fun ss(link: String): Server? {
                  if (link.contains("plugin=")) return null
                  val body = link.removePrefix("ss://")
                  val name = dec(body.substringAfter('#', ""))
                  val main = body.substringBefore('#').substringBefore('?').trimEnd('/')
                  val userinfo: String
                  val hp: String
                  if (main.contains('@')) {
                      userinfo = main.substringBeforeLast('@')
                      hp = main.substringAfterLast('@')
                  } else {
                      val d = b64(main)
                      userinfo = d.substringBeforeLast('@')
                      hp = d.substringAfterLast('@')
                  }
                  val ui = if (userinfo.contains(':')) dec(userinfo) else b64(userinfo)
                  val method = ui.substringBefore(':')
                  val password = ui.substringAfter(':')
                  val host = hp.substringBeforeLast(':').trim('[', ']')
                  val port = hp.substringAfterLast(':').toInt()
                  val ob = JSONObject()
                      .put("tag", "proxy")
                      .put("protocol", "shadowsocks")
                      .put(
                          "settings",
                          JSONObject().put(
                              "servers",
                              JSONArray().put(
                                  JSONObject().put("address", host).put("port", port).put("method", method).put("password", password)
                              )
                          )
                      )
                  return Server(name.ifEmpty { host }, host, port, ob.toString())
              }
          }
          SLK_EOF_10
          mkdir -p app/src/main/java/app/slienky/vpn
          cat > app/src/main/java/app/slienky/vpn/MainActivity.kt <<'SLK_EOF_11'
          package app.slienky.vpn

          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.animateColorAsState
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.Orientation
          import androidx.compose.foundation.gestures.draggable
          import androidx.compose.foundation.gestures.rememberDraggableState
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.launch
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.roundToInt

          class MainActivity : ComponentActivity() {

              private val vpnPermission =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      if (r.resultCode == RESULT_OK) startVpn()
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge()
                  super.onCreate(savedInstanceState)
                  setContent { App(onToggle = ::toggle) }
              }

              private fun toggle() {
                  val st = VpnState.status.value
                  if (st is VpnStatus.Connected || st is VpnStatus.Working) {
                      startService(Intent(this, SlienkyVpnService::class.java).setAction(SlienkyVpnService.ACTION_STOP))
                  } else {
                      val i = VpnService.prepare(this)
                      if (i != null) vpnPermission.launch(i) else startVpn()
                  }
              }

              private fun startVpn() {
                  startService(Intent(this, SlienkyVpnService::class.java).setAction(SlienkyVpnService.ACTION_START))
              }
          }

          private val Orange = Color(0xFFD08A40)
          private val Blue = Color(0xFF6679B0)
          private val Green = Color(0xFF2FBF8F)
          private val Indigo = Color(0xFF4A7BD0)

          @Composable
          fun App(onToggle: () -> Unit) {
              MaterialTheme(colorScheme = darkColorScheme()) {
                  val ctx = LocalContext.current
                  val status by VpnState.status.collectAsState()
                  var settings by remember { mutableStateOf(false) }

                  LaunchedEffect(Unit) {
                      if (System.currentTimeMillis() - ServerRepo.lastUpdate(ctx) > 3_600_000L) ServerRepo.refresh(ctx)
                  }

                  val connected = status is VpnStatus.Connected
                  val working = status is VpnStatus.Working

                  val headline = when (status) {
                      is VpnStatus.Idle -> "Запустите\nсоединение"
                      is VpnStatus.Working -> "Подключаем…"
                      is VpnStatus.Connected -> "Подключено"
                      is VpnStatus.Failed -> "Не удалось\nподключиться"
                  }
                  val sub = when (val s = status) {
                      is VpnStatus.Working -> s.text
                      is VpnStatus.Connected -> "Пинг: ${s.ping} мс"
                      is VpnStatus.Failed -> s.text
                      else -> ""
                  }
                  val chipText = when (val s = status) {
                      is VpnStatus.Connected -> s.name
                      else -> "Авто — лучший сервер"
                  }
                  val label = when {
                      connected -> "Проведите, чтобы отключить"
                      working -> "Проведите, чтобы отменить"
                      else -> "Проведите для подключения"
                  }

                  Box(Modifier.fillMaxSize().background(Color.Black).systemBarsPadding()) {
                      Row(Modifier.padding(start = 20.dp, top = 24.dp), verticalAlignment = Alignment.CenterVertically) {
                          Box(
                              Modifier.size(34.dp).clip(CircleShape)
                                  .background(Brush.linearGradient(listOf(Orange, Blue)))
                          )
                          Spacer(Modifier.width(12.dp))
                          Text("Slienky VPN", color = Color.White, fontSize = 30.sp, fontWeight = FontWeight.Medium)
                      }

                      Box(Modifier.align(Alignment.Center).offset(y = (-70).dp)) { Orb(connected, working) }

                      Column(Modifier.align(Alignment.BottomStart).padding(horizontal = 20.dp, vertical = 16.dp)) {
                          Box(
                              Modifier.widthIn(max = 320.dp)
                                  .clip(RoundedCornerShape(12.dp))
                                  .border(1.dp, Color(0xFF555555), RoundedCornerShape(12.dp))
                                  .padding(horizontal = 14.dp, vertical = 8.dp)
                          ) {
                              Text(
                                  "🌐  $chipText", color = Color.White, fontSize = 18.sp,
                                  fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis
                              )
                          }
                          Spacer(Modifier.height(16.dp))
                          Text(
                              headline, color = Color(0xFFE8E8E8), fontSize = 50.sp, lineHeight = 54.sp,
                              fontWeight = FontWeight.SemiBold
                          )
                          Spacer(Modifier.height(8.dp))
                          Text(
                              sub.ifEmpty { " " }, color = Color(0xFF9A9A9A), fontSize = 18.sp,
                              maxLines = 2, overflow = TextOverflow.Ellipsis
                          )
                          Spacer(Modifier.height(24.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              SlideButton(label, connected || working, Modifier.weight(1f), onToggle)
                              Spacer(Modifier.width(12.dp))
                              Box(
                                  Modifier.size(64.dp).clip(CircleShape).background(Color(0xFF2A2A2A))
                                      .clickable { settings = true },
                                  contentAlignment = Alignment.Center
                              ) { Text("⚙", color = Color.White, fontSize = 28.sp) }
                          }
                      }
                  }

                  if (settings) SettingsDialog { settings = false }
              }
          }

          @Composable
          fun Orb(connected: Boolean, working: Boolean) {
              val c1 by animateColorAsState(if (connected) Green else Orange, tween(800), label = "c1")
              val c2 by animateColorAsState(if (connected) Indigo else Blue, tween(800), label = "c2")
              val pulse = rememberInfiniteTransition(label = "pulse")
              val s by pulse.animateFloat(
