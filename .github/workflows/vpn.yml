          cat > app/src/main/java/app/slienky/vpn/SlienkyVpnService.kt <<'SLK_EOF_15'
          package app.slienky.vpn

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import kotlinx.coroutines.*
          import libv2ray.CoreCallbackHandler
          import libv2ray.CoreController
          import libv2ray.Libv2ray
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.InetSocketAddress
          import java.net.Proxy
          import java.net.URL

          class SlienkyVpnService : VpnService() {

              companion object {
                  const val ACTION_START = "app.slienky.vpn.START"
                  const val ACTION_STOP = "app.slienky.vpn.STOP"
                  private const val SOCKS_PORT = 10808
                  private var envReady = false
              }

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private var job: Job? = null
              private var tun: ParcelFileDescriptor? = null
              private var core: CoreController? = null
              private val bad = HashSet<String>()

              private val handler = object : CoreCallbackHandler {
                  override fun startup(): Long = 0
                  override fun shutdown(): Long = 0
                  override fun onEmitStatus(l: Long, s: String?): Long = 0
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopEverything()
                      return START_NOT_STICKY
                  }
                  if (job?.isActive != true) {
                      bad.clear()
                      job = scope.launch { connectLoop() }
                  }
                  return START_NOT_STICKY
              }

              private fun stopEverything() {
                  VpnState.status.value = VpnStatus.Idle
                  val j = job
                  job = null
                  scope.launch {
                      j?.cancelAndJoin()
                      stopCore()
                      closeTun()
                      VpnState.status.value = VpnStatus.Idle
                      stopSelf()
                  }
              }

              override fun onRevoke() {
                  stopEverything()
              }

              override fun onDestroy() {
                  stopCore()
                  closeTun()
                  scope.cancel()
                  VpnState.status.value = VpnStatus.Idle
                  super.onDestroy()
              }

              private fun status(s: VpnStatus) {
                  VpnState.status.value = s
              }

              private suspend fun connectLoop() {
                  try {
                      status(VpnStatus.Working("Загружаем списки…"))
                      val servers = ServerRepo.load(this)
                      if (servers.isEmpty()) {
                          status(VpnStatus.Failed("Не удалось загрузить списки серверов"))
                          return
                      }
                      while (currentCoroutineContext().isActive) {
                          status(VpnStatus.Working("Ищем рабочий сервер…"))
                          val alive = Pinger.tcpScan(servers).filter { it.first.key !in bad }
                          if (alive.isEmpty()) {
                              status(VpnStatus.Failed("Нет доступных серверов"))
                              return
                          }
                          if (tun == null) {
                              tun = establish()
                              if (tun == null) {
                                  status(VpnStatus.Failed("Нет разрешения на VPN"))
                                  return
                              }
                          }
                          status(VpnStatus.Working("Проверяем соединение…"))
                          var current: Server? = null
                          for ((s, _) in alive.take(12)) {
                              currentCoroutineContext().ensureActive()
                              if (startCore(s)) {
                                  val ms = probe()
                                  if (ms != null) {
                                      status(VpnStatus.Connected(s.name, ms))
                                      current = s
                                      break
                                  }
                              }
                              stopCore()
                              bad.add(s.key)
                          }
                          if (current == null) {
                              status(VpnStatus.Failed("Не нашли рабочий сервер, попробуйте ещё раз"))
                              return
                          }
                          monitor(current)
                          stopCore()
                          bad.add(current.key)
                      }
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      status(VpnStatus.Failed("Ошибка: ${e.message}"))
                  } finally {
                      if (VpnState.status.value !is VpnStatus.Connected && VpnState.status.value !is VpnStatus.Working) {
                          stopCore()
                          closeTun()
                      }
                  }
              }

              /** Раз в 15 секунд обновляет пинг. После двух неудач подряд возвращается (ищем другой сервер). */
              private suspend fun monitor(s: Server) {
                  var fails = 0
                  while (currentCoroutineContext().isActive) {
                      delay(15000)
                      val ms = probe()
                      if (ms != null) {
                          fails = 0
                          status(VpnStatus.Connected(s.name, ms))
                      } else if (++fails >= 2) {
                          status(VpnStatus.Working("Сервер недоступен, ищем другой…"))
                          return
                      }
                  }
              }

              private fun establish(): ParcelFileDescriptor? {
                  val b = Builder()
                      .setSession("Slienky VPN")
                      .setMtu(1500)
                      .addAddress("10.10.14.2", 30)
                      .addRoute("0.0.0.0", 0)
                      .addDnsServer("1.1.1.1")
                      .addDnsServer("8.8.8.8")
                  try {
                      b.addDisallowedApplication(packageName) // трафик самого Xray идёт мимо туннеля — без петли
                  } catch (_: Exception) {
                  }
                  return b.establish()
              }

              private fun buildConfig(outbound: String): String {
                  val tunIn = JSONObject()
                      .put("tag", "tun-in")
                      .put("port", 0)
                      .put("protocol", "tun")
                      .put("settings", JSONObject().put("name", "xray0").put("mtu", 1500).put("userLevel", 0))
                  val socksIn = JSONObject()
                      .put("tag", "socks-in")
                      .put("listen", "127.0.0.1")
                      .put("port", SOCKS_PORT)
                      .put("protocol", "socks")
                      .put("settings", JSONObject().put("auth", "noauth").put("udp", false))
                  val direct = JSONObject().put("tag", "direct").put("protocol", "freedom")
                  return JSONObject()
                      .put("log", JSONObject().put("loglevel", "warning"))
                      .put("inbounds", JSONArray().put(tunIn).put(socksIn))
                      .put("outbounds", JSONArray().put(JSONObject(outbound)).put(direct))
                      .toString()
              }

              private fun startCore(s: Server): Boolean = try {
                  if (!envReady) {
                      Libv2ray.initCoreEnv(filesDir.absolutePath, "")
                      envReady = true
                  }
                  val c = Libv2ray.newCoreController(handler)
                  c.startLoop(buildConfig(s.outbound), tun!!.fd)
                  core = c
                  Thread.sleep(300)
                  true
              } catch (e: Exception) {
                  false
              }

              private fun stopCore() {
                  try {
                      core?.stopLoop()
                  } catch (_: Exception) {
                  }
                  core = null
              }

              private fun closeTun() {
                  try {
                      tun?.close()
                  } catch (_: Exception) {
                  }
                  tun = null
              }

              /** Реальный пинг: HTTP-запрос через локальный SOCKS Xray. Первый запрос — прогрев, второй — замер. */
              private fun probe(): Int? = try {
                  val proxy = Proxy(Proxy.Type.SOCKS, InetSocketAddress("127.0.0.1", SOCKS_PORT))
                  fun once(): Int {
                      val t = System.nanoTime()
                      val con = URL("http://cp.cloudflare.com/generate_204").openConnection(proxy) as HttpURLConnection
                      con.connectTimeout = 6000
                      con.readTimeout = 6000
                      con.instanceFollowRedirects = false
                      try {
                          if (con.responseCode !in 200..399) throw java.io.IOException("bad code")
                      } finally {
                          con.disconnect()
                      }
                      return ((System.nanoTime() - t) / 1_000_000).toInt()
                  }
                  once()
                  once()
              } catch (e: Exception) {
                  null
              }
          }
